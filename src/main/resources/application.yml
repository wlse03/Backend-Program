spring:
  jpa:
    # 전송 쿼리 확인
    show-sql: true #모든 SQL문 쿼리 출력
    properties:
      hibernate:
        format_sql: true #읽기 좋은 문장으로 정렬
    # 테이블 생성 후에 data.sql 실행
    defer-datasource-initialization: true
#defer-datasource-initialization 애플리케이션을 실행할때 테이블을 생성하고 data.sql파일에 있는 쿼리를 실행하도록 하는 명령어
#show-sql, format-sql은 애플리케이션 실해애과정에 데이터베이스에 쿼리 할 일 있으면 실행구문을 모두 보여주는 명령어